<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circle Spring Academy - Admin</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        margin: 0;
        padding: 0;
      }
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 18px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="nc-root" class="loading">Loading CMS...</div>
    
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <script>
      // Simple, clean configuration
      const config = {
        backend: {
          name: 'github',
          repo: 'RickMuchira/circlespringschool',
          branch: 'main',
          base_url: 'https://circlespringschool-red.vercel.app',
          auth_endpoint: '/api/auth'
        },
        
        media_folder: 'src/imgs',
        public_folder: '/src/imgs',
        
        site_url: 'https://circlespringschool-red.vercel.app',
        display_url: 'https://circlespringschool-red.vercel.app',
        logo_url: '/src/imgs/logo-BBA39KOS.webp',
        
        collections: [
          {
            name: 'site_content',
            label: 'Website Content',
            files: [
              {
                name: 'hero_images',
                label: 'Hero Images',
                file: 'content/images.json',
                format: 'json',
                fields: [
                  {
                    name: 'home',
                    label: 'Homepage Settings',
                    widget: 'object',
                    fields: [
                      {
                        name: 'heroIntervalMs',
                        label: 'Slide Duration (milliseconds)',
                        widget: 'number',
                        default: 5000,
                        min: 2000,
                        max: 10000
                      },
                      {
                        name: 'heroSlides',
                        label: 'Hero Slides',
                        widget: 'list',
                        summary: '{{fields.alt}}',
                        fields: [
                          {
                            name: 'src',
                            label: 'Image',
                            widget: 'select',
                            options: [
                              'src/imgs/hero.webp',
                              'src/imgs/hero2.webp',
                              'src/imgs/hero3.webp',
                              'src/imgs/school-building.webp',
                              'src/imgs/studentlife.webp',
                              'src/imgs/early.webp',
                              'src/imgs/lab.webp',
                              'src/imgs/enrichment.webp',
                              'src/imgs/sports.webp',
                              'src/imgs/culture.webp'
                            ]
                          },
                          {
                            name: 'alt',
                            label: 'Description',
                            widget: 'string'
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      };
      
      // Initialize CMS when DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        // Remove loading message
        const loadingDiv = document.querySelector('.loading');
        if (loadingDiv) {
          loadingDiv.textContent = 'Initializing CMS...';
        }
        
        // Initialize CMS with a delay to ensure DOM is stable
        setTimeout(() => {
          try {
            if (window.CMS) {
              window.CMS.init({ config });
            } else {
              console.error('CMS not loaded');
            }
          } catch (error) {
            console.error('CMS initialization error:', error);
            if (loadingDiv) {
              loadingDiv.innerHTML = 'Error loading CMS. Please refresh the page.';
            }
          }
        }, 1000);
      });
    </script>
  </body>
</html>
