<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circle Spring Academy - Admin</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        margin: 0;
        padding: 0;
      }
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 18px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="nc-root" class="loading">Loading CMS...</div>
    
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <script>
      // Initialize CMS when DOM is ready - it will automatically load config.yml
      document.addEventListener('DOMContentLoaded', function() {
        // Remove loading message
        const loadingDiv = document.querySelector('.loading');
        if (loadingDiv) {
          loadingDiv.textContent = 'Initializing CMS...';
        }
        
        // Initialize CMS with a delay to ensure DOM is stable
        setTimeout(() => {
          try {
            if (window.CMS) {
              // CMS.init() without parameters will automatically load config.yml
              window.CMS.init();
              console.log('CMS initialized successfully');
            } else {
              console.error('CMS library not loaded');
              if (loadingDiv) {
                loadingDiv.innerHTML = 'Error: CMS library failed to load. Please refresh the page.';
              }
            }
          } catch (error) {
            console.error('CMS initialization error:', error);
            if (loadingDiv) {
              loadingDiv.innerHTML = 'Error loading CMS: ' + error.message + '. Please refresh the page.';
            }
          }
        }, 1000);
      });
    </script>
  </body>
</html>
