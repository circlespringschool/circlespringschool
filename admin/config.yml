backend:
  name: git-gateway
  branch: main

# Media storage
media_folder: "src/imgs/uploads"
public_folder: "/src/imgs/uploads"

# Site configuration
site_url: https://sweet-arithmetic-11361b.netlify.app
display_url: https://sweet-arithmetic-11361b.netlify.app
logo_url: "/src/imgs/logo-BBA39KOS.webp"

collections:
  - name: "config"
    label: "Site Configuration"
    files:
      - name: "images"
        label: "Images & Media"
        file: "content/images.json"
        format: "json"
        fields:
          - name: "home"
            label: "Home Page Images"
            widget: "object"
            fields:
              - name: "heroIntervalMs"
                label: "Hero Slide Duration (milliseconds)"
                widget: "number"
                default: 5000
                min: 2000
                max: 10000
                step: 500
                hint: "How long each hero image displays (2-10 seconds)"
              - name: "heroSlides"
                label: "Hero Images"
                widget: "list"
                summary: "{{fields.alt}} - {{fields.src}}"
                min: 1
                max: 6
                fields:
                  - name: "src"
                    label: "Image File"
                    widget: "image"
                    allow_multiple: false
                    hint: "Upload hero image (recommended: 1920x1080px)"
                    media_library:
                      config:
                        multiple: false
                  - name: "alt"
                    label: "Image Description"
                    widget: "string"
                    hint: "Describe what's in the image for accessibility"
          - name: "academics"
            label: "Academics Page Images"
            widget: "object"
            collapsed: true
            fields:
              - name: "featuredImages"
                label: "Academic Features"
                widget: "list"
                summary: "{{fields.title}} - {{fields.src}}"
                required: false
                fields:
                  - name: "src"
                    label: "Image"
                    widget: "image"
                  - name: "alt"
                    label: "Alt Text"
                    widget: "string"
                  - name: "title"
                    label: "Feature Title"
                    widget: "string"
          - name: "activities"
            label: "Activities Page Images"
            widget: "object"
            collapsed: true
            fields:
              - name: "gallery"
                label: "Activity Photos"
                widget: "list"
                summary: "{{fields.title}} - {{fields.src}}"
                required: false
                fields:
                  - name: "src"
                    label: "Photo"
                    widget: "image"
                  - name: "alt"
                    label: "Photo Description"
                    widget: "string"
                  - name: "title"
                    label: "Activity Name"
                    widget: "string"
                  - name: "description"
                    label: "Activity Description"
                    widget: "text"
                    required: false

